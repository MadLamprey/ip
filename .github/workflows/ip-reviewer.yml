name: iP Reviewer

on:
  push:
    tags:
      - 'Level-*'
      - 'A-*'
      - 'B-*'
  issue_comment:
    types:
      - created

jobs:
  reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo (full history for tag pushes)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout repo (shallow for issue comments)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reviewer
        run: |
          python -m pip install --upgrade pip
          pip install -e .github/ip-reviewer

      - name: Run reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IP_REVIEWER_PROVIDER: ${{ vars.IP_REVIEWER_PROVIDER }}
          IP_REVIEWER_MODEL: ${{ vars.IP_REVIEWER_MODEL }}
          IP_REVIEWER_REQUIREMENTS: .github/ip-reviewer/data/requirements.json
        run: python -m ip_reviewer
